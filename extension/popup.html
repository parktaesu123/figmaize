<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="popup.css"><title>figmaize · Figma로 보내기</title></head>
<body>
<div class="brand"><span aria-hidden="true">▧</span> figmaize <small>FIGMA BRIDGE</small></div>
<h1>이 화면을<br>피그마에서 바로 편집.</h1>
<p>현재 탭의 보이는 영역을 연결된 피그마 파일에 레이어로 만듭니다.</p>
<label for="token">로컬 서버 페어링 토큰</label>
<input id="token" type="password" autocomplete="off" spellcheck="false" placeholder="서버가 표시한 토큰 붙여넣기">
<div class="hint">토큰은 이 창이 열려 있는 동안만 유지됩니다.</div>
<button id="refresh" class="secondary">연결된 피그마 찾기</button>
<label for="session">대상 피그마 파일 · 페이지</label>
<select id="session" disabled><option value="">먼저 연결된 피그마를 찾아주세요</option></select>
<label for="name">화면 이름 <span class="optional">선택</span></label>
<input id="name" placeholder="예: 상품 상세 · 옵션 선택">
<button id="capture" disabled>현재 화면 → 피그마에 생성 <span aria-hidden="true">↗</span></button>
<button id="check-job" class="secondary" hidden>생성 상태 다시 확인</button>
<div id="status" role="status" aria-live="polite">로컬 서버를 실행하고 피그마에서 figmaize 플러그인을 연결하세요.</div>
<div id="result" hidden><small id="stats"></small><a id="download">수집 데이터 백업 저장 (.json) ↓</a></div>
<footer>수집과 전송 중에는 이 창과 현재 탭을 유지하세요. 서버가 접수한 작업은 이 창을 닫아도 유지되며, 생성을 마칠 때까지 피그마 플러그인을 열어두세요.</footer>
<script src="popup.js"></script>
</body></html>
