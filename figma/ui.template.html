<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}body{margin:0;padding:24px;font:12px/1.65 Inter,-apple-system,BlinkMacSystemFont,sans-serif;background:var(--figma-color-bg,#fbfcf9);color:var(--figma-color-text,#25362b)}.brand{font-size:16px;font-weight:650;color:#4c825e}.badge{float:right;font-size:9px;letter-spacing:1.5px;color:#8b978b;margin-top:5px}h1{font-size:25px;letter-spacing:-.9px;line-height:1.45;margin:24px 0 10px}p{color:var(--figma-color-text-secondary,#809079);font-size:11px}.connection{border:1px solid #879b8033;border-radius:10px;padding:15px;margin-top:20px}.state{display:flex;align-items:center;gap:8px;font-weight:600;font-size:12px}.dot{width:7px;height:7px;border-radius:50%;background:#b0b9ac}.online{background:#5caa72}#document{font-size:10px;margin-top:7px;word-break:break-all;color:var(--figma-color-text-secondary,#7a8772)}label{display:block;font-size:10px;color:var(--figma-color-text-secondary,#7a8772);margin-top:19px}input[type=password]{display:block;width:100%;border:1px solid #91a38655;border-radius:6px;padding:10px;margin-top:5px;background:var(--figma-color-bg-secondary,#f6f8f2);color:var(--figma-color-text,#25362b)}button{width:100%;padding:11px;border:0;border-radius:7px;background:#3b714d;color:white;font:inherit;font-weight:600;margin-top:12px;cursor:pointer}button:disabled{opacity:.45;cursor:default}#disconnect{background:#879b8022;color:var(--figma-color-text,#446747)}#status{margin-top:15px;font-size:11px;word-break:break-word;white-space:pre-wrap}#warnings{font-size:10px;max-height:90px;overflow:auto;padding-left:16px;color:var(--figma-color-text-secondary,#7a8772)}details{border-top:1px solid #91a38633;padding-top:14px;margin-top:23px;font-size:10px;color:var(--figma-color-text-secondary,#7a8772)}summary{cursor:pointer}input[type=file]{width:100%;margin:12px 0;font-size:10px}.foot{font-size:9px;margin-top:22px;color:var(--figma-color-text-secondary,#8b9684)}[hidden]{display:none!important}
</style><body><div class="brand">▧ &nbsp; figmaize <span class="badge">MCP BRIDGE</span></div><h1>대화에서 요청하고,<br>피그마에서 바로 확인.</h1><p>MCP와 연결하면 이 파일의 레이어를 만들고,<br>선택한 요소를 읽고 수정할 수 있습니다.</p>
<div class="connection"><div class="state"><span id="dot" class="dot"></span><span id="state">연결 대기</span></div><div id="document">현재 파일과 페이지에 연결합니다.</div></div>
<label for="token">로컬 연결 코드<input id="token" type="password" autocomplete="off" spellcheck="false" placeholder="start.command에서 표시된 코드"></label><button id="connect">MCP 브리지 연결</button><button id="disconnect" hidden>연결 해제</button><div id="status" role="status" aria-live="polite">이 창을 열어두면 MCP 요청이 캔버스에 반영됩니다.</div><ul id="warnings"></ul>
<details><summary>백업 JSON 파일 직접 가져오기</summary><input id="file" type="file" accept=".json"><label><input id="reference" type="checkbox" checked> 원본 스크린샷도 함께 배치</label><button id="import" disabled>파일에서 레이어 생성</button></details>
<p class="foot">연결: localhost:4318 · 연결 코드는 이 창에만 유지됩니다.<br>웹 화면은 브라우저 확장 또는 MCP의 URL 수집으로 보낼 수 있습니다.</p>
<script>window.addEventListener('error',function(event){document.querySelector('#status').textContent='플러그인 UI 오류: '+event.message;});</script><script>/* SCHEMA */</script><script>/* BRIDGE_UI */</script></body></html>
