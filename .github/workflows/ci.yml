name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node scripts/build.mjs
      - run: git diff --exit-code -- figma/code.js figma/ui.html
      - run: node --test tests/*.test.mjs extension/*.test.mjs
